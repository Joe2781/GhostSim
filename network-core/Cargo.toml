[package]
name = "ghostsim-network-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "GhostSim distributed networking and connectivity engine"
license = "MIT"

[lib]
name = "ghostsim_network_core"
path = "src/lib.rs"

[[bin]]
name = "ghostsim-network"
path = "src/main.rs"

[dependencies]
# Asynchronous networking and task execution
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "signal"
] }

# Structured error handling
thiserror = "2"

# Serialization for network messages and configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUIDs for internal device and connection identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Cryptographically secure random values
getrandom = "0.3"

# Tracing and operational diagnostics
tracing = "0.1"
tracing-subscriber = {
    version = "0.3",
    features = ["env-filter", "fmt"]
}

[dev-dependencies]
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "test-util"
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
